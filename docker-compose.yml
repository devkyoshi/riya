version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: riya_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: riya
      POSTGRES_PASSWORD: riya_dev_password
      POSTGRES_DB: riya_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riya -d riya_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: riya_postgres_test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: riya
      POSTGRES_PASSWORD: riya_dev_password
      POSTGRES_DB: riya_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riya -d riya_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: riya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass riya_redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "riya_redis_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: riya_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@riya.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - dev

  ocr:
    build: ./ocr
    container_name: riya_ocr
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      BACKEND_URL: http://host.docker.internal:3001
      INTERNAL_SECRET: dev-internal-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - ocr

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  pgadmin_data:
